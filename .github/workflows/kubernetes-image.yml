name: Kubernetes Web UI
on:
  push:
    branches: [kubernetes]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @metacubexd/kubernetes test && pnpm --filter @metacubexd/ui exec vitest run stores/__tests__/managed-endpoints.spec.ts
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/kubernetes/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/the-ccsn/metacubexd:kubernetes
            ghcr.io/the-ccsn/metacubexd:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
